[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dejacode"
version = "1.0.0"
description = "Semantic retrieval and clustering for competitive programming problems"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2", "joblib>=1.3,<2", "beautifulsoup4>=4.12,<5",
  "matplotlib>=3.7,<4"
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2", "plotly>=5.15,<7"]
semantic = ["sentence-transformers>=3,<6", "torch>=2.1"]
parquet = ["pyarrow>=14"]
test = ["pytest>=8"]

[project.scripts]
dejacode = "dejacode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
